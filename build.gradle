plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {}
    }
}

sourceSets.main.resources {
    exclude 'assets/gunsrpg/lang/zh_cn.json'
    exclude 'assets/gunsrpg/lang/en_us.json'
    exclude 'assets/gunsrpg/lang/zh_cn_skills.json'
    exclude 'assets/gunsrpg/lang/en_us_skills.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:configuration-444699:${configuration_file_id}")

    // TaCZ — required at runtime (mods.toml); compileOnly for integration (replaces pure reflection over time)
    compileOnly fg.deobf("curse.maven:tacz-1028108:${tacz_file_id}")

    // JEI — compileOnly; runtime optional via mods.toml
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
}

// Merge split lang shards at build time (cross-platform Gradle; no PowerShell).
tasks.register('mergeLangFiles') {
    def inDir = file('src/main/resources/assets/gunsrpg/lang')
    def outDir = file('build/generated/resources/assets/gunsrpg/lang')
    inputs.dir(inDir)
    outputs.dir(outDir)
    doLast {
        outDir.mkdirs()
        def slurper = new groovy.json.JsonSlurper()
        ['zh_cn', 'en_us'].each { loc ->
            def merged = new LinkedHashMap()
            inDir.eachFile { f ->
                if (f.name == "${loc}.json" || (f.name.startsWith("${loc}_") && f.name.endsWith('.json'))) {
                    merged.putAll(slurper.parse(f))
                }
            }
            new File(outDir, "${loc}.json").text =
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged))
        }
    }
}

// Optional dev-only asset generators (Windows PowerShell). Not required to build the mod jar.
tasks.register('sliceQGunIcons') {
    onlyIf { System.getProperty('os.name').toLowerCase().contains('windows') }
    doLast {
        exec {
            workingDir project.projectDir
            commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'tools/slice_q_gun_icons.ps1'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn mergeLangFiles
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(layout.buildDirectory.dir('generated/resources')) {
        include 'assets/gunsrpg/lang/zh_cn.json'
        include 'assets/gunsrpg/lang/en_us.json'
    }
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
