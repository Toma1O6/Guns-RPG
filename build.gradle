plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {}
    }
}

sourceSets.main.resources {
    exclude 'assets/gunsrpg/lang/zh_cn.json'
    exclude 'assets/gunsrpg/lang/en_us.json'
    exclude 'assets/gunsrpg/lang/zh_cn_skills.json'
    exclude 'assets/gunsrpg/lang/en_us_skills.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:configuration-444699:${configuration_file_id}")
    def jeiJar = file("${project.projectDir}/../mods").listFiles()?.find {
        it.name.toLowerCase().contains('jei-1.20.1-forge') && it.name.endsWith('.jar')
    }
    if (jeiJar != null) {
        compileOnly files(jeiJar)
        println "[gunsrpg] JEI compileOnly: ${jeiJar.name}"
    } else {
        compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    }
    def sbCoreJar = file("${project.projectDir}/../mods").listFiles()?.find {
        it.name.contains('sophisticatedcore') && it.name.endsWith('.jar')
    }
    def sbJar = file("${project.projectDir}/../mods").listFiles()?.find {
        it.name.contains('sophisticatedbackpacks') && it.name.endsWith('.jar')
    }
    if (sbCoreJar != null && sbJar != null) {
        compileOnly files(sbCoreJar)
        compileOnly files(sbJar)
        println "[gunsrpg] Sophisticated Backpacks compileOnly: ${sbJar.name}"
    }
}

tasks.register('mergeLangFiles') {
    def inDir = file('src/main/resources/assets/gunsrpg/lang')
    def outDir = file('build/generated/resources/assets/gunsrpg/lang')
    inputs.dir(inDir)
    outputs.dir(outDir)
    doLast {
        outDir.mkdirs()
        def slurper = new groovy.json.JsonSlurper()
        ['zh_cn', 'en_us'].each { loc ->
            def merged = new LinkedHashMap()
            inDir.eachFile { f ->
                if (f.name == "${loc}.json" || (f.name.startsWith("${loc}_") && f.name.endsWith('.json'))) {
                    merged.putAll(slurper.parse(f))
                }
            }
            new File(outDir, "${loc}.json").text =
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged))
        }
    }
}

tasks.register('sliceQGunIcons') {
    def sheet = file('tools/gunsrpg_q_guns_sheet.png')
    inputs.file('tools/slice_q_gun_icons.ps1')
    inputs.file(sheet)
    outputs.dir('src/main/resources/assets/gunsrpg/textures/item')
    doLast {
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            exec {
                workingDir project.projectDir
                commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'tools/slice_q_gun_icons.ps1'
            }
        }
    }
}

