tasks.named('processResources', ProcessResources).configure {
    dependsOn mergeLangFiles, sliceQGunIcons, importUserGunIcons, importUserGunIconsBatch2, genResistanceTiers, portMedstationRecipes
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(layout.buildDirectory.dir('generated/resources')) {
        include 'assets/gunsrpg/lang/zh_cn.json'
        include 'assets/gunsrpg/lang/en_us.json'
    }
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
